<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Arena | Gaming Portal</title>
    <style>
        /* --- CSS (Design) --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #0b0b0b;
            color: #fff;
            font-family: 'Orbitron', sans-serif; /* Gaming font style */
            overflow-x: hidden;
        }

        header {
            padding: 20px 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #000;
            border-bottom: 3px solid #00f2ff;
        }

        .logo { font-size: 1.8rem; color: #00f2ff; font-weight: bold; text-shadow: 0 0 10px #00f2ff; }

        .hero {
            text-align: center;
            padding: 100px 20px;
            background: linear-gradient(45deg, #0b0b0b, #1a0033);
        }

        .hero h1 { font-size: 3.5rem; margin-bottom: 10px; color: #ff00ff; }

        /* Game Section */
        #game-container {
            background: #1a1a1a;
            width: 80%;
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #ff00ff;
            text-align: center;
            box-shadow: 0 0 20px #ff00ff;
        }

        .game-btn {
            background: #00f2ff;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 20px;
            transition: 0.3s;
        }

        .game-btn:hover {
            background: #ff00ff;
            color: white;
            transform: scale(1.1);
        }

        #score { font-size: 2rem; color: #00f2ff; margin: 15px 0; }

        footer { text-align: center; padding: 20px; color: #555; }
    </style>
</head>
<body>

    <header>
        <div class="logo">NEON ARENA</div>
        <div class="score-board">Top Score: <span id="high-score">0</span></div>
    </header>

    <section class="hero">
        <h1>PLAY & WIN</h1>
        <p>The fastest fingers win the prize.</p>
    </section>

    <div id="game-container">
        <h2>Clicker Challenge</h2>
        <p>Click as fast as you can in 10 seconds!</p>
        <div id="score">0</div>
        <div id="timer">Time Left: 10s</div>
        <button class="game-btn" id="click-btn">START GAME</button>
    </div>

    <footer>
        &copy; 2026 Neon Arena Gaming. Created with ❤️ for Gamers.
    </footer>
